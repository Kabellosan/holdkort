<!doctype html>
<html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tilbudsliste-test</title>
<script src="https://cdn.jsdelivr.net/npm/proj4@2.12.1/dist/proj4.js"></script>
<style>body{font:16px/1.4 system-ui,sans-serif;margin:16px;max-width:640px;background:#fff;color:#222}
p{margin:6px 0}.ok{color:#2a7a00}.bad{color:#b00020}img,canvas{max-width:100%;border:1px solid #ccc;margin-top:8px}</style>
</head><body>
<!-- A one-off check (2026-10-21): may the app read the colours of the kommune's tilbudsliste pictures (WMS GetMap, CORS)?
     If yes, a tilbudsliste line can take exactly the elements under its colour. -->
<h2>Tilbudsliste-test</h2>
<p>Siden spørger kommunens kort om 16.3a i Nørre Snede og prøver at læse farverne. Vent et øjeblik.</p>
<div id="out"></div>
<script>
const WMS = "https://kort.ikast-brande.dk/wms", SVC = "entreprenoer_udbud";
proj4.defs("EPSG:25832", "+proj=utm +zone=32 +ellps=GRS80 +units=m +no_defs");
const out = document.getElementById("out");
const say = (t, c) => { const p = document.createElement("p"); p.className = c || ""; p.textContent = t; out.append(p); };
(async ()=>{
  let name;
  try{
    const caps = await (await fetch(`${WMS}?SERVICENAME=${SVC}&SERVICE=WMS&VERSION=1.1.1&REQUEST=GetCapabilities`)).text();
    const doc = new DOMParser().parseFromString(caps, "text/xml");
    const l = [...doc.getElementsByTagName("Layer")].find(l=>/^16\.3 ?a\b/i.test(l.querySelector(":scope > Title")?.textContent || ""));
    name = l?.querySelector(":scope > Name")?.textContent;
    say(name ? "1. Fandt laget 16.3 a ✓" : "1. Fandt ikke laget 16.3 a", name ? "ok" : "bad");
    if(!name) return;
  }catch(e){ say("1. Kunne ikke hente kortets lagliste: " + e.message, "bad"); return; }
  const [x, y] = proj4("EPSG:4326", "EPSG:25832", [9.403, 55.968]).map(Math.round); // Nørre Snede
  const bbox = [x-1000, y-700, x+1000, y+700], W = 1600, H = 1120;
  const url = `${WMS}?SERVICENAME=${SVC}&SERVICE=WMS&VERSION=1.1.1&REQUEST=GetMap&LAYERS=${encodeURIComponent(name)}&STYLES=&SRS=EPSG:25832&BBOX=${bbox.join(",")}&WIDTH=${W}&HEIGHT=${H}&FORMAT=image/png&TRANSPARENT=true`;
  // Round 2 (2026-10-21): every GetMap format was blocked, but GetLegendGraphic and DescribeLayer could be read.
  // DescribeLayer may name a WFS behind the layer; then the app could read the kommune's own 16.3 a table.
  const q = `SERVICENAME=${SVC}&SERVICE=WMS&VERSION=1.1.1`, L = encodeURIComponent(name);
  try{
    const x = await (await fetch(`${WMS}?${q}&REQUEST=DescribeLayer&LAYERS=${L}`)).text();
    say("DescribeLayer:", "ok"); const pre = document.createElement("pre"); pre.style.whiteSpace = "pre-wrap"; pre.textContent = x.slice(0, 1500); out.append(pre);
    const d = new DOMParser().parseFromString(x, "text/xml"), ld = d.querySelector("LayerDescription"), qy = d.querySelector("Query");
    const ows = ld?.getAttribute("owsURL") || ld?.getAttribute("wfs"), tn = qy?.getAttribute("typeName");
    if(ows && tn){
      const u = `${ows}${ows.includes("?") ? "&" : "?"}SERVICE=WFS&VERSION=1.1.0&REQUEST=GetFeature&TYPENAME=${encodeURIComponent(tn)}&MAXFEATURES=3&OUTPUTFORMAT=application/json`;
      try{ const t = await (await fetch(u)).text(); say("WFS bag laget: læst ✓ " + t.slice(0, 400), "ok"); }catch(e){ say("WFS bag laget: blokeret (" + e.message + ") " + u, "bad"); }
    }
  }catch(e){ say("DescribeLayer: blokeret (" + e.message + ")", "bad"); }
  // Variants of GetMap, in case the server only lets some spellings through
  const tries = [
    ["request=getmap (små bogstaver)", `${WMS}?servicename=${SVC}&service=WMS&version=1.1.1&request=getmap&layers=${L}&styles=&srs=EPSG:25832&bbox=${bbox.join(",")}&width=400&height=280&format=image/png&transparent=true`],
    ["WMS 1.3.0", `${WMS}?SERVICENAME=${SVC}&SERVICE=WMS&VERSION=1.3.0&REQUEST=GetMap&LAYERS=${L}&STYLES=&CRS=EPSG:25832&BBOX=${bbox.join(",")}&WIDTH=400&HEIGHT=280&FORMAT=image/png&TRANSPARENT=true`],
    ["GetFeatureInfo", `${WMS}?${q}&REQUEST=GetFeatureInfo&LAYERS=${L}&QUERY_LAYERS=${L}&STYLES=&SRS=EPSG:25832&BBOX=${bbox.join(",")}&WIDTH=400&HEIGHT=280&X=200&Y=140&INFO_FORMAT=text/plain&FEATURE_COUNT=5`],
  ];
  for(const [t, u] of tries){
    try{ const r = await fetch(u), b = await r.blob(); say(`${t}: læst ✓ HTTP ${r.status}, ${b.type}, ${b.size} byte: ${(await b.slice(0, 120).text()).replace(/[^\x20-\x7e]/g, "·")}`, "ok"); }
    catch(e){ say(`${t}: blokeret (${e.message})`, "bad"); }
  }
  say("Send et skærmbillede af det hele til Claude (rul ned, hvis der er mere).");
})();
</script>
</body></html>
